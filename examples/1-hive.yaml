# 1-hive's route table (mirrors 1-hive/deploy/route-table.yaml; version history there).
# Pools: a Claude Pro plan (Claude Code), a ChatGPT plan (Codex), SingularityCompute
# (self-hosted models, reached through the hive gateway: LiteLLM, since they speak only chat
# completions) and the host's GPU (Ollama, for the scorer). SingularityCompute is listed first
# in its tiers (prefer: order), backed up by the paid plans. `fixed` is the launcher before
# routing: the baseline to measure against (ROUTING.md §6).
format: hive-route.table/1
version: 9
prefer: order        # SingularityCompute (self-hosted) first in each tier; the paid plans back it up
pools:
  claude-plan:  {kind: subscription, limits: [{window: 5h}, {window: 7d}]}
  chatgpt-plan: {kind: subscription, limits: [{window: 5h}, {window: 7d}]}
  local-gpu:    {kind: local, limits: [{concurrent: 1}]}
  # Anthropic API, pay per call through the gateway; last in its tiers, a test budget for now.
  anthropic-api: {kind: metered, limits: [{usd: 10, per: month}, {usd: 5, per: attempt}], gateway_key_env: ANTHROPIC_API_KEY}
  # SingularityCompute (self-hosted). Chat completions only, so every harness reaches it through
  # the hive gateway (LiteLLM on 127.0.0.1:4000), which drops the two harness fields it rejects.
  singularity:  {kind: local, limits: [{concurrent: 4}], gateway_key_env: SINGULARITY_API_KEY, gateway_drop_params: [client_metadata, safeguards]}
routes:
  opus-plan:    {tier: strong,   pool: claude-plan,  family: claude, harness: claude-code, model: claude-opus-5-5, effort: high, tools: true}
  opus-std:     {tier: standard, pool: claude-plan,  family: claude, harness: claude-code, model: claude-opus-5-5, effort: medium, tools: true}
  gpt-astra-high: {tier: strong, pool: chatgpt-plan, family: gpt,    harness: codex, model: gpt-6-astra, effort: high, tools: true}
  sonnet-plan:  {tier: standard, pool: claude-plan,  family: claude, harness: claude-code, model: claude-sonnet-5, tools: true}
  gpt-sol-plan: {tier: standard, pool: chatgpt-plan, family: gpt,    harness: codex, model: gpt-5.6-sol, effort: medium, tools: true}
  sonnet-low:   {tier: light,    pool: claude-plan,  family: claude, harness: claude-code, model: claude-sonnet-5, effort: low, tools: true}
  gpt-sol-low:  {tier: light,    pool: chatgpt-plan, family: gpt,    harness: codex, model: gpt-5.6-sol, effort: low, tools: true}
  sc-deepseek-v4:  {tier: standard, pool: singularity, family: deepseek, harness: claude-code, model: deepseek/deepseek-v4-flash-0731, gateway_model: custom_openai/deepseek/deepseek-v4-flash-0731, endpoint: "https://llm.a.singularitycompute.com/v1", via_gateway: true, tools: true}
  sc-qwen3.8-27b:  {tier: light,    pool: singularity, family: qwen,     harness: claude-code, model: qwen/qwen3.8-27b, gateway_model: custom_openai/qwen/qwen3.8-27b, endpoint: "https://llm.a.singularitycompute.com/v1", via_gateway: true, tools: true}
  api-opus:     {tier: strong,   pool: anthropic-api, family: claude, harness: claude-code, model: claude-opus-5-5, gateway_model: anthropic/claude-opus-5-5, effort: high, via_gateway: true, price: {in: 4, out: 20}, tools: true}
  api-sonnet:   {tier: standard, pool: anthropic-api, family: claude, harness: claude-code, model: claude-sonnet-5-5, gateway_model: anthropic/claude-sonnet-5-5, via_gateway: true, price: {in: 2, out: 10}, tools: true}
  qwen-local:   {tier: local,    pool: local-gpu,    family: qwen,   harness: ollama, endpoint: "http://127.0.0.1:11434", model: "qwen3:8b", tools: false}
tiers:
  strong:   [opus-plan, gpt-astra-high, api-opus]
  standard: [sc-deepseek-v4, opus-std, sonnet-plan, gpt-sol-plan, api-sonnet]
  light:    [sc-qwen3.8-27b, sonnet-low, gpt-sol-low]
  local:    [qwen-local]
scorer: {route: qwen-local, mode: shadow, max_output_tokens: 800, timeout_s: 90}
fixed:
  work: opus-plan
  review: gpt-sol-plan
