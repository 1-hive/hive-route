[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hiveroute"
version = "0.1.0.dev0"
description = "One Hive R8: a slim model router - named routes, a deterministic decide(), a replayable decision log"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "One Hive" }]
dependencies = [
    "jsonschema>=4.21",
    "pyyaml>=6",
]

[project.scripts]
hive-route = "hiveroute.cli:main"

[project.urls]
Homepage = "https://github.com/1-hive/hive-route"
Specification = "https://github.com/1-hive/hive-route/blob/main/ROUTING.md"

[project.optional-dependencies]
test = ["pytest>=8"]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/hiveroute"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "hiveroute/_schemas"

[tool.hatch.build.targets.sdist]
include = ["src/hiveroute", "schemas", "fixtures", "examples", "canaries", "ROUTING.md", "README.md", "LICENSE", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
